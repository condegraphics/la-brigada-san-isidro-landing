name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Guardrail: este repo tambien alimenta Hostinger. Un Disallow total en la
      # raiz desindexaria el dominio real, no la maqueta.
      - name: Verificar robots.txt de produccion
        run: |
          if [ -f robots.txt ] && grep -qE '^[[:space:]]*Disallow:[[:space:]]*/\*?[[:space:]]*$' robots.txt; then
            echo "::error::robots.txt de la raiz bloquea todo el sitio y se publicaria en el dominio real."
            exit 1
          fi

      # Solo se publica lo que debe ser publico: quedan fuera .git, .github,
      # .docs, .gitignore y .htaccess (este ultimo es exclusivo del hosting Apache).
      - name: Stage public site
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.htaccess' \
            --exclude '.docs' \
            --exclude '_site' \
            ./ _site/

      # La maqueta de Pages no debe competir con el dominio real: noindex solo
      # en el artefacto. Los archivos del repo (y por lo tanto Hostinger) no cambian.
      - name: Marcar maqueta como noindex (solo artifact de Pages)
        run: |
          printf '%s\n' \
            '# Maqueta de staging: Googlebot rastrea para leer el noindex y desindexar.' \
            '# Los crawlers generativos quedan bloqueados (la maqueta no es la fuente oficial).' \
            'User-agent: *' \
            'Allow: /' \
            'User-agent: GPTBot' 'Disallow: /' \
            'User-agent: OAI-SearchBot' 'Disallow: /' \
            'User-agent: ClaudeBot' 'Disallow: /' \
            'User-agent: PerplexityBot' 'Disallow: /' \
            'User-agent: Google-Extended' 'Disallow: /' \
            'User-agent: CCBot' 'Disallow: /' > _site/robots.txt
          for f in _site/*.html; do
            perl -0pi -e '
              s{<meta\s+name="robots"\s+content="[^"]*"[^>]*>}{<meta name="robots" content="noindex, nofollow">}i
              or s{<meta\s+content="[^"]*"\s+name="robots"[^>]*>}{<meta name="robots" content="noindex, nofollow">}i
              or s{<head(\s[^>]*)?>}{$&\n  <meta name="robots" content="noindex, nofollow">}i;
            ' "$f"
          done
          grep -o 'name="robots" content="[^"]*"' _site/index.html

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
